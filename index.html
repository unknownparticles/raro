<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI塔罗测算</title>
    <link rel="preload" as="image" href="tarot_images/Background.webp" type="image/webp">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@auth0/auth0-spa-js@1.19.3/dist/umd/auth0-spa.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <!-- Background Effects Layer -->
    <div class="bg-effects">
        <div class="star-layer"></div>
        <div class="glow-layer"></div>
    </div>

    <!-- History Sidebar -->
    <div id="history-sidebar" class="sidebar collapsed">
        <div class="sidebar-header">
            <h3>📜 历史记录</h3>
            <button id="close-sidebar" class="icon-btn">&times;</button>
        </div>
        <div id="history-list" class="history-list">
            <!-- Items injected by JS -->
            <div class="empty-history">暂无记录</div>
        </div>
    </div>

    <!-- Sidebar Toggle Button -->
    <button id="sidebar-toggle" class="sidebar-toggle" title="查看历史">📜</button>

    <header>
        <h1>AI塔罗测算</h1>
        <div class="auth-buttons">
            <button id="settings-button" title="设置">⚙️ 设置</button>
            <button id="login-button">登录/注册</button>
            <button id="logout-button" style="display: none;">退出</button>
        </div>
    </header>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>设置</h2>
            <div class="input-group">
                <label for="provider-select">AI Provider:</label>
                <select id="provider-select">
                    <option value="deepseek">DeepSeek</option>
                    <option value="glm">GLM</option>
                    <option value="kimi">Kimi</option>
                </select>
            </div>
            <div class="input-group">
                <label for="provider-key">API Key:</label>
                <input type="password" id="provider-key" placeholder="sk-...">
            </div>
            <button id="save-settings">保存</button>
        </div>
    </div>

    <!-- AI Analysis Result Modal -->
    <div id="analysis-modal" class="modal hidden">
        <div class="modal-content large">
            <span class="close-analysis">&times;</span>
            <h2>🔮 AI 解牌结果</h2>
            <div id="analysis-result" class="analysis-text">正在连接宇宙能量...</div>
            <div id="clarifier-panel" class="clarifier-panel hidden">
                <div id="clarifier-message" class="clarifier-message"></div>
                <button id="clarifier-button" class="special-btn">补一张澄清牌</button>
            </div>
        </div>
    </div>

    <div class="container">

        <div class="controls-bar">
            <div class="select-wrapper">
                <label for="spread">选择塔罗牌阵：</label>
                <select id="spread">
                    <option value="timeline">时间之流三张</option>
                    <option value="decision">抉择指引三张</option>
                    <option value="relationship">关系洞察五张</option>
                    <option value="career">事业路径五张</option>
                </select>
            </div>
            <button id="draw-card" disabled>开始抽牌</button>
            <button id="analyze-btn" style="display: none;" class="special-btn">🔮 AI 解读</button>
        </div>
        <div class="question-panel">
            <label for="question-input">你想问什么？</label>
            <textarea id="question-input" rows="3" placeholder="例如：我未来三个月是否适合换工作？"></textarea>
            <div id="question-display" class="question-display hidden"></div>
        </div>
        <div id="spread-description" class="spread-description"></div>

        <div class="tarot-spread" id="tarot-container">
            <!-- Slots for the spread -->
        </div>

        <div class="deck-area hidden">
            <div id="deck-instruction" class="deck-instruction">请凭直觉抽取牌</div>
            <div id="deck-container" class="deck-fan">
                <!-- 78 Cards will be generated here by JS -->
            </div>
        </div>

    </div>

    <script src="scripts.js"></script>
</body>

</html>
