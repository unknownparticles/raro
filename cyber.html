<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI塔罗测算 · 赛博模式 Beta</title>
    <link rel="stylesheet" href="cyber.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="tarot-ai-shared.js"></script>
</head>

<body>
    <div class="bg-effects">
        <div class="star-layer"></div>
        <div class="glow-layer"></div>
    </div>

    <div class="top-tools">
        <a href="index.html" class="top-tool">经典</a>
        <button id="settings-button" class="top-tool" type="button">设置</button>
    </div>

    <main class="cyber-shell">
        <section id="intro-screen" class="intro-screen">
            <div class="intro-copy">
                <p class="eyebrow">Cyber Tarot Beta</p>
                <h1 id="intro-title">先选择牌阵</h1>
                <p id="intro-subtitle" class="intro-subtitle">比出 1 / 2 / 3 / 4 选择牌阵，再用 OK 确认进入提问</p>
                <div class="intro-status intro-status-global">
                    <span id="gesture-status">等待摄像头</span>
                </div>
            </div>

            <div id="spread-grid" class="spread-grid" aria-label="选择牌阵">
                <button class="spread-card is-active" type="button" data-spread="timeline">
                    <span class="spread-card-number">1</span>
                    <strong>时间之流</strong>
                    <span>3 张</span>
                </button>
                <button class="spread-card" type="button" data-spread="decision">
                    <span class="spread-card-number">2</span>
                    <strong>抉择指引</strong>
                    <span>3 张</span>
                </button>
                <button class="spread-card" type="button" data-spread="relationship">
                    <span class="spread-card-number">3</span>
                    <strong>关系洞察</strong>
                    <span>5 张</span>
                </button>
                <button class="spread-card" type="button" data-spread="career">
                    <span class="spread-card-number">4</span>
                    <strong>事业路径</strong>
                    <span>5 张</span>
                </button>
            </div>

            <div id="question-shell" class="question-shell is-hidden">
                <textarea id="question-input" rows="3" placeholder="例如：我接下来更适合什么类型的工作？" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-bwignore="true"></textarea>
                <div class="intro-actions">
                    <button id="voice-button" class="ghost-button" type="button">语音输入</button>
                    <button id="start-button" class="primary-button" type="button">开始抽牌</button>
                </div>
                <div class="intro-status">
                    <span id="voice-status">可直接输入，或点语音说话</span>
                </div>
            </div>

            <select id="spread-select" class="visually-hidden" autocomplete="off" data-form-type="other">
                <option value="timeline">时间之流三张</option>
                <option value="decision">抉择指引三张</option>
                <option value="relationship">关系洞察五张</option>
                <option value="career">事业路径五张</option>
            </select>
            <button id="analyze-button" class="visually-hidden" type="button" disabled>开始解析</button>
        </section>

        <section id="reading-screen" class="reading-screen">
            <div class="cyber-aura"></div>
            <div id="deck-stage" class="deck-stage" aria-live="polite"></div>
            <section id="picked-cards" class="picked-cards"></section>
            <div id="selection-status" class="reading-counter">0 / 0</div>
        </section>
    </main>

    <video id="gesture-video" class="gesture-video" playsinline muted></video>
    <canvas id="gesture-overlay" class="gesture-overlay" aria-hidden="true"></canvas>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-card">
            <button class="close-button" data-close="settings-modal" type="button">&times;</button>
            <h2>AI 设置</h2>
            <label for="provider-select">Provider</label>
            <select id="provider-select" autocomplete="off" data-form-type="other">
                <option value="deepseek">DeepSeek</option>
                <option value="glm">GLM</option>
                <option value="kimi">Kimi</option>
            </select>
            <label for="provider-key">API Key</label>
            <input id="provider-key" type="password" placeholder="sk-..." autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-bwignore="true">
            <label class="settings-switch" for="mirror-toggle">
                <input id="mirror-toggle" type="checkbox">
                <span>前置镜像预览</span>
            </label>
            <div id="provider-help" class="provider-help"></div>
            <button id="save-settings" class="primary-button block-button" type="button">保存设置</button>
        </div>
    </div>

    <div id="analysis-modal" class="modal hidden">
        <div class="modal-card large-card">
            <button class="close-button" data-close="analysis-modal" type="button">&times;</button>
            <h2>AI 解读</h2>
            <div id="analysis-result" class="analysis-result">等待解析...</div>
        </div>
    </div>

    <script src="cyber.js"></script>
</body>

</html>
